# Supabase URL and publishable (anon) key are public by design: Next.js embeds NEXT_PUBLIC_*
# values in the browser bundle. Tell Netlify's secrets scanner to ignore only these two keys.
# Keep the scanner on for everything else.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
